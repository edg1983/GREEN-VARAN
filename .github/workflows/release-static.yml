name: Build and Release Static Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-static:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    permissions:
      contents: write

    steps:
      - name: Install Alpine musl build dependencies
        run: |
          apk add --no-cache \
            build-base \
            musl-dev \
            clang-dev \
            clang-libclang \
            llvm-dev \
            cmake \
            make \
            perl \
            linux-headers \
            file \
            tar \
            gzip \
            git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-musl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-musl-cargo-

      - name: Run unit tests
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          HTS_STATIC: "1"
        run: cargo test --features static

      - name: Build static self-contained release binaries
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          HTS_STATIC: "1"
        run: cargo build --release --features static

      - name: Verify static linking and smoke-test binaries
        run: |
          file target/release/greenvaran
          file target/release/greendb_query
          file target/release/greenvaran | grep -q "statically linked"
          file target/release/greendb_query | grep -q "statically linked"
          ./target/release/greenvaran version
          ./target/release/greendb_query --help > /dev/null

      - name: Package release assets
        id: pkg
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          mkdir -p dist

          # Standalone static executables (compatible with direct download URLs)
          cp target/release/greenvaran dist/greenvaran
          cp target/release/greendb_query dist/greendb_query

          # Versioned archive containing both binaries
          TARBALL="greenvaran-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -C dist -czf "dist/${TARBALL}" greenvaran greendb_query

          (cd dist && sha256sum greenvaran greendb_query "${TARBALL}" > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Attach static binaries to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/greenvaran
            dist/greendb_query
            dist/greenvaran-*-x86_64-unknown-linux-musl.tar.gz
            dist/SHA256SUMS.txt

      - name: Upload workflow artifacts (manual dispatch)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: greenvaran-static-linux-musl
          path: dist/
