name: Build and Release Static Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-static:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl cross-compilation toolchain and libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools \
            musl-dev \
            clang \
            libclang-dev \
            cmake \
            make \
            perl \
            pkg-config \
            file
          sudo ln -sf /usr/include/linux /usr/include/x86_64-linux-musl/linux
          sudo ln -sf /usr/include/asm-generic /usr/include/x86_64-linux-musl/asm-generic
          sudo ln -sf /usr/include/x86_64-linux-gnu/asm /usr/include/x86_64-linux-musl/asm

      - name: Set up Rust toolchain with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-musl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-musl-cargo-

      - name: Run unit tests (static musl target)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          HTS_STATIC: "1"
          RUSTFLAGS: "-C target-feature=+crt-static"
          BINDGEN_EXTRA_CLANG_ARGS: "-isystem /usr/include/x86_64-linux-musl"
        run: cargo test --target x86_64-unknown-linux-musl --features static

      - name: Build static self-contained release binaries
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          HTS_STATIC: "1"
          RUSTFLAGS: "-C target-feature=+crt-static"
          BINDGEN_EXTRA_CLANG_ARGS: "-isystem /usr/include/x86_64-linux-musl"
        run: cargo build --release --target x86_64-unknown-linux-musl --features static

      - name: Verify static linking and smoke-test binaries
        run: |
          BIN_DIR="target/x86_64-unknown-linux-musl/release"
          file "${BIN_DIR}/greenvaran"
          file "${BIN_DIR}/greendb_query"
          file "${BIN_DIR}/greenvaran" | grep -Eq "statically linked|static-pie linked"
          file "${BIN_DIR}/greendb_query" | grep -Eq "statically linked|static-pie linked"
          "./${BIN_DIR}/greenvaran" version
          "./${BIN_DIR}/greendb_query" --help > /dev/null

      - name: Package release assets
        id: pkg
        run: |
          BIN_DIR="target/x86_64-unknown-linux-musl/release"
          RAW_TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          mkdir -p dist

          # Standalone static executables (compatible with direct download URLs)
          cp "${BIN_DIR}/greenvaran" dist/greenvaran
          cp "${BIN_DIR}/greendb_query" dist/greendb_query

          # Versioned archive containing both binaries
          TARBALL="greenvaran-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -C dist -czf "dist/${TARBALL}" greenvaran greendb_query

          (cd dist && sha256sum greenvaran greendb_query "${TARBALL}" > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Attach static binaries to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/greenvaran
            dist/greendb_query
            dist/greenvaran-*-x86_64-unknown-linux-musl.tar.gz
            dist/SHA256SUMS.txt

      - name: Upload workflow artifacts (manual dispatch)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: greenvaran-static-linux-musl
          path: dist/
